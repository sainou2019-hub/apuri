<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEON DODGE DX - オンラインランキング対応アクション</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <style>
    :root {
      --bg-color: #090a0f;
      --panel-bg: rgba(18, 22, 36, 0.9);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #ff007f;
      --gold: #ffd700;
      --purple: #b537f2;
      --orange: #ff7b00;
      --text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #gameCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      touch-action: none;
    }

    /* HUD (プレイ中のスコア・状態表示) */
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .hud-box {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 10px 16px;
      border-radius: 12px;
      backdrop-filter: blur(4px);
    }

    .score-label {
      font-size: 11px;
      color: var(--primary);
      letter-spacing: 1px;
    }

    .score-value {
      font-size: 26px;
      font-weight: bold;
      text-shadow: 0 0 10px var(--primary);
    }

    #comboDisplay {
      font-size: 14px;
      color: var(--gold);
      font-weight: bold;
      margin-top: 2px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .status-badges {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      justify-content: flex-end;
    }

    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 6px;
      display: none;
    }

    .badge-shield { background: rgba(0, 242, 254, 0.25); border: 1px solid var(--primary); color: var(--primary); }
    .badge-slow { background: rgba(181, 55, 242, 0.25); border: 1px solid var(--purple); color: #e0aaff; }

    /* 実績解除トースト通知 */
    #toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translate(-50%, -120px);
      z-index: 20;
      background: linear-gradient(90deg, rgba(25, 30, 50, 0.95), rgba(45, 35, 20, 0.95));
      border: 1px solid var(--gold);
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.4);
      padding: 12px 20px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    #toast.show {
      transform: translate(-50%, 0);
    }

    /* オーバーレイメニュー */
    #overlay {
      position: absolute;
      z-index: 10;
      width: 92%;
      max-width: 480px;
      max-height: 92vh;
      overflow-y: auto;
      background: var(--panel-bg);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 22px;
      text-align: center;
      backdrop-filter: blur(14px);
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.2);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 30px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }

    .sound-btn {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 8px;
    }

    .subtitle {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 14px;
    }

    /* ユーザー情報エリア */
    .auth-section {
      background: rgba(0, 0, 0, 0.35);
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      display: none;
    }

    .user-name { font-size: 13px; font-weight: bold; }
    .user-best { font-size: 11px; color: var(--gold); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      transition: transform 0.1s, box-shadow 0.2s, background 0.2s;
    }

    button:active { transform: scale(0.96); }

    .btn-google {
      background: #ffffff;
      color: #333;
      padding: 7px 12px;
      font-size: 12px;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 10px;
      font-size: 11px;
    }

    .btn-play {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      color: #000;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.45);
      margin-bottom: 14px;
    }

    /* タブナビゲーション */
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 12px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      background: transparent;
      color: #aaa;
      border-radius: 8px;
    }

    .tab-btn.active {
      background: rgba(0, 242, 254, 0.2);
      color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(0, 242, 254, 0.4);
    }

    .tab-content {
      text-align: left;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 12px;
      height: 215px;
      overflow-y: auto;
    }

    /* ランキング */
    .rank-list { list-style: none; }
    .rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 13px;
    }
    .rank-item:last-child { border-bottom: none; }
    .rank-num { width: 26px; font-weight: bold; color: #888; }
    .rank-1 .rank-num { color: var(--gold); }
    .rank-2 .rank-num { color: #c0c0c0; }
    .rank-3 .rank-num { color: #cd7f32; }
    .rank-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
    .rank-score { font-weight: bold; color: var(--primary); }

    /* スキングリッド */
    .skin-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .skin-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .skin-card.selected {
      border-color: var(--primary);
      background: rgba(0, 242, 254, 0.15);
    }

    .skin-card.locked {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .skin-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .skin-meta { flex: 1; min-width: 0; }
    .skin-title { font-size: 12px; font-weight: bold; }
    .skin-req { font-size: 10px; color: #aaa; }

    /* 実績リスト */
    .ach-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .ach-item:last-child { border-bottom: none; }
    .ach-icon {
      font-size: 20px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }
    .ach-item.unlocked .ach-icon {
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid var(--gold);
    }
    .ach-info { flex: 1; }
    .ach-title { font-size: 12px; font-weight: bold; color: #ddd; }
    .ach-item.unlocked .ach-title { color: var(--gold); }
    .ach-desc { font-size: 11px; color: #888; }

    .item-legend {
      display: flex;
      justify-content: center;
      gap: 12px;
      font-size: 11px;
      color: #bbb;
      margin-top: 10px;
    }

    .hidden { display: none !important; }

    #resultBanner {
      margin-bottom: 12px;
      padding: 8px;
      background: rgba(255, 0, 127, 0.2);
      border: 1px solid var(--accent);
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <!-- 実績解除通知 -->
  <div id="toast">
    <span style="font-size: 24px;" id="toastIcon">🏆</span>
    <div style="text-align: left;">
      <div style="font-size: 10px; color: var(--gold); font-weight: bold;">ACHIEVEMENT UNLOCKED!</div>
      <div style="font-size: 14px; font-weight: bold;" id="toastTitle">実績名</div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <canvas id="gameCanvas"></canvas>

  <!-- プレイ中HUD -->
  <div id="hud" class="hidden">
    <div class="hud-box">
      <div class="score-label">SCORE</div>
      <div class="score-value" id="hudScore">0</div>
      <div id="comboDisplay">COMBO x1</div>
    </div>
    <div class="hud-box" style="text-align: right;">
      <div class="score-label">FEVER GAUGE</div>
      <div class="score-value" id="hudFever" style="color: var(--accent);">0%</div>
      <div class="status-badges">
        <span id="badgeShield" class="badge badge-shield">🛡️ SHIELD</span>
        <span id="badgeSlow" class="badge badge-slow">⏳ SLOW</span>
      </div>
    </div>
  </div>

  <!-- メニューオーバーレイ -->
  <div id="overlay">
    <div class="top-bar">
      <h1>NEON DODGE DX</h1>
      <button id="soundToggleBtn" class="sound-btn">🔊 SE: ON</button>
    </div>
    <p class="subtitle">スターと特殊アイテムを集めてハイスコア＆実績解除を目指せ！</p>

    <!-- リザルト -->
    <div id="resultBanner" class="hidden">
      <div style="font-size: 12px; color: #ff80bf;">GAME OVER</div>
      <div style="font-size: 24px; font-weight: bold;" id="finalScore">0</div>
      <div style="font-size: 11px; color: var(--gold);" id="newRecordMsg" class="hidden">🎉 NEW RECORD! ランキング更新！</div>
    </div>

    <!-- Googleログインステータス -->
    <div class="auth-section">
      <div class="user-info">
        <img id="userAvatar" class="user-avatar" src="" alt="avatar" />
        <div>
          <div class="user-name" id="userName">ゲストプレイヤー</div>
          <div class="user-best" id="userBest">ログインするとランキング＆実績を保存</div>
        </div>
      </div>
      <button id="loginBtn" class="btn-google">Googleでログイン</button>
      <button id="logoutBtn" class="btn-logout hidden">ログアウト</button>
    </div>

    <button id="startBtn" class="btn-play">PLAY START</button>

    <!-- タブ切り替え -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="tabRank">🏆 ランキング</button>
      <button class="tab-btn" data-tab="tabSkins">🎨 スキン (<span id="skinCount">1/6</span>)</button>
      <button class="tab-btn" data-tab="tabAch">🎖️ 実績 (<span id="achCount">0/6</span>)</button>
    </div>

    <!-- タブ1: ランキング -->
    <div id="tabRank" class="tab-content">
      <ul class="rank-list" id="rankList">
        <li class="rank-item" style="justify-content: center; color: #888;">読み込み中...</li>
      </ul>
    </div>

    <!-- タブ2: スキン -->
    <div id="tabSkins" class="tab-content hidden">
      <div class="skin-grid" id="skinGrid"></div>
    </div>

    <!-- タブ3: 実績 -->
    <div id="tabAch" class="tab-content hidden">
      <div id="achList"></div>
    </div>

    <div class="item-legend">
      <span>🛡️ シールド: 1回防御</span>
      <span>⏳ スロー: 敵減速</span>
      <span>💥 ボム: 敵全消去</span>
    </div>
  </div>

  <!-- Firebase & ゲームロジック -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup,
      signInWithRedirect,
      getRedirectResult,
      signOut, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      collection, 
      query, 
      orderBy, 
      limit, 
      onSnapshot,
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDnlfnMpZZVxPHLR87unzwLH13Vovx6Qqk",
      authDomain: "apuri-b4d56.firebaseapp.com",
      projectId: "apuri-b4d56",
      storageBucket: "apuri-b4d56.firebasestorage.app",
      messagingSenderId: "366055633446",
      appId: "1:366055633446:web:f686e28a3ce84acea3ece7"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // --- サウンドエンジン (Web Audio API) ---
    let soundEnabled = true;
    let audioCtx = null;

    function playTone(freq, type, duration, vol = 0.12, slideFreq = null) {
      if (!soundEnabled) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slideFreq) {
        osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    const sfx = {
      star: (combo) => playTone(520 + Math.min(combo * 45, 600), "sine", 0.15, 0.12, 880 + Math.min(combo * 50, 700)),
      item: () => { playTone(440, "triangle", 0.12, 0.15, 880); setTimeout(() => playTone(660, "triangle", 0.2, 0.15, 1320), 80); },
      shieldBreak: () => playTone(300, "sawtooth", 0.25, 0.15, 90),
      bomb: () => playTone(160, "sawtooth", 0.45, 0.2, 35),
      fever: () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => playTone(f, "square", 0.18, 0.1), i * 60)); },
      achievement: () => { [587, 880, 1174].forEach((f, i) => setTimeout(() => playTone(f, "sine", 0.25, 0.15), i * 90)); },
      gameover: () => playTone(260, "sawtooth", 0.5, 0.18, 55)
    };

    document.getElementById("soundToggleBtn").addEventListener("click", (e) => {
      soundEnabled = !soundEnabled;
      e.target.textContent = soundEnabled ? "🔊 SE: ON" : "🔇 SE: OFF";
    });

    // --- 実績 & スキンマスターデータ ---
    const ACHIEVEMENTS = [
      { id: "first_play", icon: "🚀", title: "初陣", desc: "初めてゲームをプレイする", skinReward: null },
      { id: "score_3000", icon: "⭐", title: "ライジングスター", desc: "スコア 3,000 pts を達成", skinReward: "emerald" },
      { id: "combo_10", icon: "🔥", title: "コンボマスター", desc: "10コンボ以上を達成", skinReward: "solar" },
      { id: "fever_once", icon: "⚡", title: "フィーバータイム", desc: "フィーバーモードに突入する", skinReward: "magenta" },
      { id: "item_5", icon: "🎒", title: "アイテムハンター", desc: "累計5個の特殊アイテムを取得", skinReward: "diamond" },
      { id: "score_10000", icon: "👑", title: "ネオンの覇者", desc: "スコア 10,000 pts を達成", skinReward: "royal_star" }
    ];

    const SKINS = [
      { id: "cyan", name: "デフォルトシアン", color: "#00f2fe", shape: "circle", reqText: "初期装備", unlockAch: null },
      { id: "emerald", name: "エメラルドパルス", color: "#00ff88", shape: "circle", reqText: "実績「ライジングスター」", unlockAch: "score_3000" },
      { id: "solar", name: "ソーラーフレア", color: "#ff9900", shape: "circle", reqText: "実績「コンボマスター」", unlockAch: "combo_10" },
      { id: "magenta", name: "サイバーピンク", color: "#ff007f", shape: "circle", reqText: "実績「フィーバータイム」", unlockAch: "fever_once" },
      { id: "diamond", name: "クリスタルダイヤ", color: "#70d6ff", shape: "diamond", reqText: "実績「アイテムハンター」", unlockAch: "item_5" },
      { id: "royal_star", name: "ロイヤルスター", color: "#ffd700", shape: "star", reqText: "実績「ネオンの覇者」", unlockAch: "score_10000" }
    ];

    // プレイヤーセーブデータ
    let userData = {
      bestScore: 0,
      unlockedAchievements: [],
      selectedSkin: "cyan",
      totalItemsCollected: 0
    };

    // ローカルストレージから初期読み込み（ゲスト用バックアップ）
    try {
      const savedLocal = localStorage.getItem("neon_dodge_dx_save");
      if (savedLocal) userData = { ...userData, ...JSON.parse(savedLocal) };
    } catch (e) {}

    // --- UI更新（スキン・実績） ---
    function renderSkinsAndAchievements() {
      const skinGrid = document.getElementById("skinGrid");
      const achList = document.getElementById("achList");
      skinGrid.innerHTML = "";
      achList.innerHTML = "";

      let unlockedSkinCount = 0;
      SKINS.forEach((skin) => {
        const isUnlocked = !skin.unlockAch || userData.unlockedAchievements.includes(skin.unlockAch);
        if (isUnlocked) unlockedSkinCount++;
        const isSelected = userData.selectedSkin === skin.id;

        const card = document.createElement("div");
        card.className = `skin-card ${isSelected ? "selected" : ""} ${!isUnlocked ? "locked" : ""}`;
        const borderRadius = skin.shape === "diamond" ? "4px" : "50%";
        const transform = skin.shape === "diamond" ? "rotate(45deg) scale(0.8)" : "none";

        card.innerHTML = `
          <div class="skin-preview" style="background:${skin.color}; box-shadow:0 0 10px ${skin.color}; border-radius:${borderRadius}; transform:${transform};"></div>
          <div class="skin-meta">
            <div class="skin-title">${skin.name} ${isSelected ? "✓" : ""}</div>
            <div class="skin-req">${isUnlocked ? "使用可能" : skin.reqText}</div>
          </div>
        `;
        if (isUnlocked) {
          card.addEventListener("click", () => {
            userData.selectedSkin = skin.id;
            saveUserProgress();
            renderSkinsAndAchievements();
          });
        }
        skinGrid.appendChild(card);
      });

      document.getElementById("skinCount").textContent = `${unlockedSkinCount}/${SKINS.length}`;
      document.getElementById("achCount").textContent = `${userData.unlockedAchievements.length}/${ACHIEVEMENTS.length}`;

      ACHIEVEMENTS.forEach((ach) => {
        const unlocked = userData.unlockedAchievements.includes(ach.id);
        const div = document.createElement("div");
        div.className = `ach-item ${unlocked ? "unlocked" : ""}`;
        div.innerHTML = `
          <div class="ach-icon">${unlocked ? ach.icon : "🔒"}</div>
          <div class="ach-info">
            <div class="ach-title">${ach.title}</div>
            <div class="ach-desc">${ach.desc}</div>
          </div>
        `;
        achList.appendChild(div);
      });
    }

    // トースト通知キュー
    let toastTimeout = null;
    function unlockAchievement(achId) {
      if (userData.unlockedAchievements.includes(achId)) return;
      const ach = ACHIEVEMENTS.find((a) => a.id === achId);
      if (!ach) return;

      userData.unlockedAchievements.push(achId);
      sfx.achievement();
      renderSkinsAndAchievements();
      saveUserProgress();

      const toast = document.getElementById("toast");
      document.getElementById("toastIcon").textContent = ach.icon;
      document.getElementById("toastTitle").textContent = ach.title;
      toast.classList.add("show");
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove("show"), 3200);
    }

    // タブ切り替え
    document.querySelectorAll(".tab-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
        document.querySelectorAll(".tab-content").forEach((c) => c.classList.add("hidden"));
        btn.classList.add("active");
        document.getElementById(btn.dataset.tab).classList.remove("hidden");
      });
    });

    // --- Firebase 認証 & データ同期 ---
    const loginBtn = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const userNameEl = document.getElementById("userName");
    const userBestEl = document.getElementById("userBest");
    const userAvatarEl = document.getElementById("userAvatar");
    const rankListEl = document.getElementById("rankList");

    let currentUser = null;

    getRedirectResult(auth).catch((e) => console.error(e));

    loginBtn.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        if (error.code === "auth/popup-blocked" || error.code === "auth/cancelled-popup-request") {
          await signInWithRedirect(auth, provider);
        } else if (error.code !== "auth/popup-closed-by-user") {
          alert("ログインエラー: " + error.message);
        }
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    async function saveUserProgress(newScore = null) {
      if (newScore !== null && newScore > userData.bestScore) {
        userData.bestScore = newScore;
      }
      localStorage.setItem("neon_dodge_dx_save", JSON.stringify(userData));

      if (!currentUser) return;
      userBestEl.textContent = `自己ベスト: ${userData.bestScore.toLocaleString()} pts`;

      try {
        await setDoc(doc(db, "leaderboard", currentUser.uid), {
          name: currentUser.displayName || "プレイヤー",
          score: userData.bestScore,
          unlockedAchievements: userData.unlockedAchievements,
          selectedSkin: userData.selectedSkin,
          totalItemsCollected: userData.totalItemsCollected,
          updatedAt: serverTimestamp()
        }, { merge: true });
      } catch (e) {
        console.error("Save error:", e);
      }
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        loginBtn.classList.add("hidden");
        logoutBtn.classList.remove("hidden");
        userNameEl.textContent = user.displayName || "プレイヤー";
        if (user.photoURL) {
          userAvatarEl.src = user.photoURL;
          userAvatarEl.style.display = "block";
        }

        const snap = await getDoc(doc(db, "leaderboard", user.uid));
        if (snap.exists()) {
          const d = snap.data();
          userData.bestScore = Math.max(userData.bestScore, d.score || 0);
          userData.unlockedAchievements = Array.from(new Set([...userData.unlockedAchievements, ...(d.unlockedAchievements || [])]));
          if (d.selectedSkin) userData.selectedSkin = d.selectedSkin;
          userData.totalItemsCollected = Math.max(userData.totalItemsCollected, d.totalItemsCollected || 0);
        }
        userBestEl.textContent = `自己ベスト: ${userData.bestScore.toLocaleString()} pts`;
        renderSkinsAndAchievements();
        saveUserProgress();
      } else {
        loginBtn.classList.remove("hidden");
        logoutBtn.classList.add("hidden");
        userAvatarEl.style.display = "none";
        userNameEl.textContent = "ゲストプレイヤー";
        userBestEl.textContent = "ログインするとランキング＆実績を保存";
      }
    });

    // リアルタイムランキング監視
    const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(10));
    onSnapshot(q, (snapshot) => {
      rankListEl.innerHTML = "";
      if (snapshot.empty) {
        rankListEl.innerHTML = `<li class="rank-item" style="justify-content:center; color:#888;">まだ記録がありません！</li>`;
        return;
      }
      let rank = 1;
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const li = document.createElement("li");
        li.className = `rank-item rank-${rank}`;
        li.innerHTML = `
          <span class="rank-num">#${rank}</span>
          <span class="rank-name">${escapeHtml(data.name || "名無し")}</span>
          <span class="rank-score">${Number(data.score).toLocaleString()}</span>
        `;
        rankListEl.appendChild(li);
        rank++;
      });
    });

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    renderSkinsAndAchievements();

    // --- ゲームエンジン (HTML5 Canvas) ---
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let isPlaying = false;
    let score = 0;
    let combo = 0;
    let comboTimer = 0;
    let feverGauge = 0;
    let isFever = false;
    let feverTimer = 0;
    let hasShield = false;
    let slowTimer = 0;
    let frameCount = 0;

    const player = { x: width / 2, y: height / 2, r: 14, targetX: width / 2, targetY: height / 2 };
    let enemies = [];
    let stars = [];
    let powerups = [];
    let particles = [];

    function updateTarget(x, y) {
      player.targetX = x;
      player.targetY = y;
    }
    window.addEventListener("mousemove", (e) => updateTarget(e.clientX, e.clientY));
    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) updateTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });
    window.addEventListener("touchstart", (e) => {
      if (e.touches.length > 0) updateTarget(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    function spawnEnemy() {
      const edge = Math.floor(Math.random() * 4);
      let x, y;
      if (edge === 0) { x = Math.random() * width; y = -20; }
      else if (edge === 1) { x = width + 20; y = Math.random() * height; }
      else if (edge === 2) { x = Math.random() * width; y = height + 20; }
      else { x = -20; y = Math.random() * height; }

      const angle = Math.atan2(player.y - y, player.x - x) + (Math.random() - 0.5) * 0.5;
      const speed = 2.6 + Math.min(score / 2500, 5.5) + Math.random() * 1.5;
      enemies.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        r: 10 + Math.random() * 8
      });
    }

    function spawnStar() {
      const margin = 50;
      stars.push({
        x: margin + Math.random() * (width - margin * 2),
        y: margin + Math.random() * (height - margin * 2),
        r: 10,
        pulse: 0
      });
    }

    function spawnPowerup() {
      const types = ["shield", "slow", "bomb"];
      const type = types[Math.floor(Math.random() * types.length)];
      const margin = 60;
      powerups.push({
        x: margin + Math.random() * (width - margin * 2),
        y: margin + Math.random() * (height - margin * 2),
        type,
        r: 14,
        life: 480 // 8秒で消える
      });
    }

    function createParticles(x, y, color, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1.0,
          color
        });
      }
    }

    function drawPlayerShape(x, y, r, shape, color) {
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;

      if (shape === "diamond") {
        ctx.beginPath();
        ctx.moveTo(x, y - r - 3);
        ctx.lineTo(x + r + 3, y);
        ctx.lineTo(x, y + r + 3);
        ctx.lineTo(x - r - 3, y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else if (shape === "star") {
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          const outerAngle = (i * 2 * Math.PI) / 5 - Math.PI / 2;
          const innerAngle = outerAngle + Math.PI / 5;
          ctx.lineTo(x + Math.cos(outerAngle) * (r + 4), y + Math.sin(outerAngle) * (r + 4));
          ctx.lineTo(x + Math.cos(innerAngle) * (r * 0.5), y + Math.sin(innerAngle) * (r * 0.5));
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, r + 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function startGame() {
      isPlaying = true;
      score = 0;
      combo = 0;
      comboTimer = 0;
      feverGauge = 0;
      isFever = false;
      hasShield = false;
      slowTimer = 0;
      frameCount = 0;
      enemies = [];
      stars = [];
      powerups = [];
      particles = [];
      player.x = player.targetX = width / 2;
      player.y = player.targetY = height / 2;

      for (let i = 0; i < 3; i++) spawnStar();
      unlockAchievement("first_play");

      document.getElementById("overlay").classList.add("hidden");
      document.getElementById("hud").classList.remove("hidden");
      document.getElementById("newRecordMsg").classList.add("hidden");
    }

    async function gameOver() {
      isPlaying = false;
      sfx.gameover();
      createParticles(player.x, player.y, "#00f2fe", 40);
      document.getElementById("hud").classList.add("hidden");
      document.getElementById("overlay").classList.remove("hidden");
      document.getElementById("resultBanner").classList.remove("hidden");
      document.getElementById("finalScore").textContent = `${score.toLocaleString()} pts`;
      document.getElementById("startBtn").textContent = "PLAY AGAIN";

      const isNewRecord = score > userData.bestScore;
      await saveUserProgress(score);
      if (isNewRecord && currentUser) {
        document.getElementById("newRecordMsg").classList.remove("hidden");
      }
    }

    document.getElementById("startBtn").addEventListener("click", startGame);

    function loop() {
      requestAnimationFrame(loop);

      ctx.fillStyle = "rgba(9, 10, 15, 0.26)";
      ctx.fillRect(0, 0, width, height);

      // パーティクル
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.03;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1.0;

      if (!isPlaying) return;

      frameCount++;
      score += 1;

      if (score >= 3000) unlockAchievement("score_3000");
      if (score >= 10000) unlockAchievement("score_10000");

      player.x += (player.targetX - player.x) * 0.18;
      player.y += (player.targetY - player.y) * 0.18;

      if (combo > 0) {
        comboTimer--;
        if (comboTimer <= 0) {
          combo = 0;
          document.getElementById("comboDisplay").style.opacity = 0;
        }
      }

      if (isFever) {
        feverTimer--;
        feverGauge = Math.max(0, Math.ceil((feverTimer / 300) * 100));
        if (feverTimer <= 0) isFever = false;
      }

      if (slowTimer > 0) slowTimer--;

      const spawnRate = Math.max(12, 42 - Math.floor(score / 400));
      if (frameCount % spawnRate === 0) spawnEnemy();
      if (stars.length < 3) spawnStar();
      if (frameCount % 480 === 0 && powerups.length < 2) spawnPowerup(); // 約8秒ごとに特殊アイテム

      // 特殊アイテム描画・取得判定
      for (let i = powerups.length - 1; i >= 0; i--) {
        const pw = powerups[i];
        pw.life--;
        if (pw.life <= 0) {
          powerups.splice(i, 1);
          continue;
        }

        const colorMap = { shield: "#00f2fe", slow: "#b537f2", bomb: "#ff7b00" };
        const iconMap = { shield: "🛡️", slow: "⏳", bomb: "💥" };
        const c = colorMap[pw.type];

        ctx.shadowBlur = 15;
        ctx.shadowColor = c;
        ctx.strokeStyle = c;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(pw.x, pw.y, pw.r + Math.sin(frameCount * 0.15) * 2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.font = "15px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(iconMap[pw.type], pw.x, pw.y);

        if (Math.hypot(player.x - pw.x, player.y - pw.y) < player.r + pw.r + 6) {
          powerups.splice(i, 1);
          userData.totalItemsCollected++;
          if (userData.totalItemsCollected >= 5) unlockAchievement("item_5");

          if (pw.type === "shield") {
            hasShield = true;
            sfx.item();
            createParticles(pw.x, pw.y, "#00f2fe", 20);
          } else if (pw.type === "slow") {
            slowTimer = 300; // 5秒スロー
            sfx.item();
            createParticles(pw.x, pw.y, "#b537f2", 20);
          } else if (pw.type === "bomb") {
            sfx.bomb();
            score += enemies.length * 100;
            enemies.forEach((e) => createParticles(e.x, e.y, "#ff7b00", 10));
            enemies = [];
            createParticles(pw.x, pw.y, "#ff7b00", 35);
          }
        }
      }

      // スター描画・取得判定
      for (let i = stars.length - 1; i >= 0; i--) {
        const s = stars[i];
        s.pulse += 0.1;
        const radius = s.r + Math.sin(s.pulse) * 2.5;

        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ffd700";
        ctx.fillStyle = "#ffd700";
        ctx.beginPath();
        ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (Math.hypot(player.x - s.x, player.y - s.y) < player.r + s.r + 6) {
          stars.splice(i, 1);
          combo++;
          comboTimer = 180;
          if (combo >= 10) unlockAchievement("combo_10");

          const bonus = 100 * combo;
          score += bonus;
          sfx.star(combo);

          const comboEl = document.getElementById("comboDisplay");
          comboEl.textContent = `COMBO x${combo} (+${bonus})`;
          comboEl.style.opacity = 1;
          createParticles(s.x, s.y, "#ffd700", 15);

          if (!isFever) {
            feverGauge = Math.min(100, feverGauge + 20);
            if (feverGauge >= 100) {
              isFever = true;
              feverTimer = 300;
              sfx.fever();
              unlockAchievement("fever_once");
              createParticles(player.x, player.y, "#ff007f", 30);
            }
          }
        }
      }

      // 敵の移動・衝突判定
      const speedMult = slowTimer > 0 ? 0.4 : 1.0;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx * speedMult;
        e.y += e.vy * speedMult;

        if (e.x < -60 || e.x > width + 60 || e.y < -60 || e.y > height + 60) {
          enemies.splice(i, 1);
          continue;
        }

        ctx.shadowBlur = 12;
        ctx.shadowColor = slowTimer > 0 ? "#b537f2" : "#ff0055";
        ctx.fillStyle = slowTimer > 0 ? "#c77dff" : "#ff0055";
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (Math.hypot(player.x - e.x, player.y - e.y) < player.r + e.r - 3) {
          if (isFever) {
            enemies.splice(i, 1);
            score += 250;
            createParticles(e.x, e.y, "#ff0055", 18);
          } else if (hasShield) {
            // シールドで防御
            hasShield = false;
            enemies.splice(i, 1);
            sfx.shieldBreak();
            createParticles(player.x, player.y, "#00f2fe", 25);
          } else {
            gameOver();
            return;
          }
        }
      }

      // プレイヤー描画（選択中スキン反映）
      const activeSkin = SKINS.find((s) => s.id === userData.selectedSkin) || SKINS[0];
      const playerColor = isFever ? "#ff007f" : activeSkin.color;

      ctx.shadowBlur = isFever ? 26 : 18;
      ctx.shadowColor = playerColor;
      drawPlayerShape(player.x, player.y, player.r + (isFever ? 3 : 0), activeSkin.shape, playerColor);
      ctx.shadowBlur = 0;

      // シールドバリア描画
      if (hasShield) {
        ctx.strokeStyle = "#00f2fe";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r + 11, frameCount * 0.05, frameCount * 0.05 + Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // HUD更新
      document.getElementById("hudScore").textContent = score.toLocaleString();
      const hudFever = document.getElementById("hudFever");
      hudFever.textContent = isFever ? "FEVER!!" : `${feverGauge}%`;
      hudFever.style.color = isFever ? "#ffd700" : "#ff007f";

      document.getElementById("badgeShield").style.display = hasShield ? "inline-block" : "none";
      document.getElementById("badgeSlow").style.display = slowTimer > 0 ? "inline-block" : "none";
    }

    loop();
  </script>
</body>
</html>
